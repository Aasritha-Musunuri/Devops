name: Java Maven CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'CI-CD/java-maven/**'
      - '.github/workflows/java-maven.yml'
  pull_request:
    paths:
      - 'CI-CD/java-maven/**'
      - '.github/workflows/java-maven.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CI-CD/java-maven
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: CI-CD/java-maven/pom.xml

      - name: Compile, test, and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Check the packaged application
        shell: bash
        run: |
          set -euo pipefail
          result="$(java -jar target/shipping-quote-1.0.0.jar 500)"
          echo "$result"
          grep -Fxq 'Shipping: Rs 0' <<< "$result"
          result="$(java -jar target/shipping-quote-1.0.0.jar 499)"
          grep -Fxq 'Shipping: Rs 50' <<< "$result"
          if java -jar target/shipping-quote-1.0.0.jar -1; then
            echo "Negative order total was incorrectly accepted."
            exit 1
          fi

      - name: Check the website
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/shipping-quote-1.0.0.jar > /tmp/shipping-quote.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:8080/health
          curl --fail http://localhost:8080/ | grep -q 'id="quote-form"'
          curl --fail 'http://localhost:8080/api/shipping?amount=500' | grep -Fq '"shipping":0'

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: CI-CD/java-maven/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Save runnable JAR
        uses: actions/upload-artifact@v7
        with:
          name: shipping-quote
          path: CI-CD/java-maven/target/shipping-quote-1.0.0.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy locally
    needs: build
    if: >-
      github.repository == 'Aasritha-Musunuri/Devops' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    concurrency:
      group: shipping-quote-local
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tested JAR
        uses: actions/download-artifact@v8
        with:
          name: shipping-quote
          path: .deployment

      - name: Deploy to Docker Desktop
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: ./CI-CD/java-maven/deploy.ps1 -ArtifactDirectory .deployment -ImageTag $env:DEPLOY_COMMIT
