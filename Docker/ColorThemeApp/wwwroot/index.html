<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Color Picker</h1>

        <p>Select a color:</p>

        <div class="buttons">
            <button onclick="selectColor('red')">Red</button>
            <button onclick="selectColor('green')">Green</button>
            <button onclick="selectColor('blue')">Blue</button>
            <button onclick="selectColor('yellow')">Yellow</button>
        </div>

        <div id="colorBox">
            Select a color
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
